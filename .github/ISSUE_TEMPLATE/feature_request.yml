name: Feature request
description: Suggest a focused improvement to DeckMate.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need, not a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how DeckMate should help and what should remain unchanged.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Where would this be useful? (optional)
      description: Share the operating system, desktop session, and use case if relevant.
    validations:
      required: false
